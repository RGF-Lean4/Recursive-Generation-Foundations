name = "RGF"
version = "0.1.0"
defaultTargets = ["RGF"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

# ─────────────────────────────────────────────────────────────────────────────
# The project exposes a single library `RGF`, rooted at the repository root
# (`srcDir = "."`), with the aggregator entry point `RGF.lean` (module `RGF`).
#
# All modules are organised thematically under the `RGF/` subtree into four
# top-level branches (directory ↔ module namespace strictly aligned):
#   RGF/Math/          — pure mathematics foundations (RGF.Math.*)
#       Real/ SetTheory/ Analysis/ Category/ Spectral/ Graph/ Algebra/ Topology/
#       (the internal transfinite set theory lives under Math/SetTheory/RGF2/)
#   RGF/Generative/    — generative spine & metamathematics (RGF.Generative.*)
#       Core/ Locking/ Uniqueness/ Meta/ Bridge/
#   RGF/Physics/       — universal physical dynamics (RGF.Physics.*)
#       Dynamics/ Emergence/
#   RGF/Phenomenology/ — locked-in numeric predictions & regression suites
#       StandardModel/ TestSuite/                     (RGF.Phenomenology.*)
# ─────────────────────────────────────────────────────────────────────────────

